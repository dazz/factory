# User documentation — Hugo + Hextra (STACK: Documentation).
# Local preview: docker run --rm -p 1313:1313 -v "$PWD":/src hugomods/hugo:go hugo server --bind 0.0.0.0
baseURL: https://dazz.github.io/ncxten/
title: ncxten
locale: en-us
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true # Hextra uses HTML shortcodes
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/dazz/ncxten
      params:
        icon: github

params:
  description: "A software factory: one durable process per repository, working the board through agent sessions."
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: normal
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/dazz/ncxten/edit/main/docs/content
