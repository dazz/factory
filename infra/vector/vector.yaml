sources:
  dazzhub:                                             # one source per repository, explicit path, no glob
    type: file
    include: ["/events/dazz/dazzhub.jsonl"]
    read_from: end

transforms:
  decode:                                              # decode only, no format knowledge; the one Better-Stack-specific place
    type: remap
    inputs: [dazzhub]                                  # second repository: append its source here
    source: |
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed))
        # the line Better Stack shows as Message; every field stays searchable on its own
        who = if .automation == null { .kind } else { .automation }
        .message = join!(compact([.repository, who, .issue, .level, .outcome, .detail]), " · ")
      } else {
        # a broken line must not pass silently: the error alert catches it; not part of schema v1, born in this pipeline
        .outcome = "undecodable"; .level = "error"; .detail = slice!(.message, 0, 500)
      }
      del(.file); del(.source_type); del(.host); del(.timestamp)   # Vector's own fields, incl. its second time field
      .dt = .time                                      # Better Stack reads the event time from dt; on undecodable lines .time is null → arrival time

  split:                                               # heartbeats only prove liveness; in the live tail they buried the lines that carry state
    type: route
    inputs: [decode]
    route:
      heartbeat: '.outcome == "heartbeat"'             # no consumer; everything else leaves as split._unmatched

sinks:
  better_stack:
    type: http
    inputs: [split._unmatched]
    uri: "https://${BETTERSTACK_INGEST_HOST}"
    method: post
    encoding: { codec: json }
    auth: { strategy: bearer, token: "${BETTERSTACK_SOURCE_TOKEN}" }
    buffer: { type: disk, max_size: 268435488 }        # the minimum; survives restarts. No retry_attempts: the default retries practically forever

  uptime_dazzhub:                                      # one per repository: any event resets the Better Stack Uptime heartbeat
    type: http
    inputs: [decode]                                   # all events, not only heartbeats; second repository: route on .repository first (README)
    uri: "${BETTERSTACK_HEARTBEAT_URL_DAZZHUB}"
    method: post
    encoding: { codec: json }
    buffer: { type: memory, when_full: drop_newest }   # a late ping is worthless, and a stuck Uptime must never block the log sink
